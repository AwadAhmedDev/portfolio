# Captures des 5 sites en ligne (roadmap lot 4), lancées à la main. Résultat : un artefact à relire,
# puis à déposer dans images-source/ avant le workflow Images. Rien n'est poussé automatiquement.
name: Captures

on:
  workflow_dispatch:
  # Aussi au push d'une modification du script (le lancement manuel n'existe que depuis main).
  push:
    paths: [scripts/captures.mjs, .github/workflows/captures.yml]

permissions:
  contents: read

jobs:
  captures:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT: "@playwright/test@1.65.1" # installé seulement sur GitHub (R7)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save "$PLAYWRIGHT"
      - run: npx playwright install --with-deps chromium
      - run: node scripts/captures.mjs
      # Vidéo du parcours : début et fin coupés, 1280 px de large, sans son, en MP4 (lu par tous les navigateurs).
      # « faststart » : la lecture commence avant la fin du téléchargement.
      - name: Vidéos MP4
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p videos
          for v in videos-source/*.webm; do
            nom=$(basename "$v" .webm)
            debut=$(cat "videos-source/$nom.debut" 2>/dev/null || echo 0)
            duree=$(cat "videos-source/$nom.duree" 2>/dev/null || echo 60)
            # Coupe après lecture (-ss après -i) : avant, les WebM de Playwright donnaient une image figée.
            ffmpeg -loglevel error -y -i "$v" -ss "$debut" -t "$duree" -vf "scale=1280:-2,fps=30" -an \
              -c:v libx264 -crf 28 -preset slow -pix_fmt yuv420p -movflags +faststart "videos/$nom.mp4"
            # Planche de contrôle : une image toutes les 2 s, pour relire la vidéo avant publication.
            ffmpeg -loglevel error -y -i "videos/$nom.mp4" -vf "fps=1/2,scale=480:-2,tile=3x3" -frames:v 1 "videos/$nom-planche.png"
            ls -l "videos/$nom".* "videos/$nom-planche.png"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: captures
          path: |
            images-source/*.png
            videos/*
            videos-source/*.webm
          retention-days: 7
