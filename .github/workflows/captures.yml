# Captures des 5 sites en ligne (roadmap lot 4), lancées à la main. Résultat : un artefact à relire,
# puis à déposer dans images-source/ avant le workflow Images. Rien n'est poussé automatiquement.
name: Captures

on:
  workflow_dispatch:
  # Aussi au push d'une modification du script (le lancement manuel n'existe que depuis main).
  push:
    paths: [scripts/captures.mjs, .github/workflows/captures.yml]

permissions:
  contents: read

jobs:
  captures:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT: "@playwright/test@1.65.1" # installé seulement sur GitHub (R7)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save "$PLAYWRIGHT"
      - run: npx playwright install --with-deps chromium
      - run: node scripts/captures.mjs
      # Vidéo du parcours : début coupé (chargement), 1280 px de large, sans son ; MP4 pour tous les navigateurs,
      # WebM plus léger pour ceux qui le lisent. « faststart » : la lecture commence avant la fin du téléchargement.
      - name: Vidéos MP4 et WebM
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p videos
          for v in videos-source/*.webm; do
            nom=$(basename "$v" .webm)
            debut=$(cat "videos-source/$nom.debut" 2>/dev/null || echo 0)
            ffmpeg -loglevel error -y -i "$v" -ss "$debut" -vf "scale=1280:-2,fps=30" -an \
              -c:v libx264 -crf 28 -preset slow -pix_fmt yuv420p -movflags +faststart "videos/$nom.mp4"
            ffmpeg -loglevel error -y -i "$v" -ss "$debut" -vf "scale=1280:-2,fps=30" -an \
              -c:v libvpx-vp9 -crf 40 -b:v 0 -row-mt 1 "videos/$nom.webm"
            ls -l "videos/$nom".*
          done
      - uses: actions/upload-artifact@v7
        with:
          name: captures
          path: |
            images-source/*.png
            videos/*
            videos-source/*.webm
          retention-days: 7
