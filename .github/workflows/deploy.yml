# Déploiement continu (architecture.md §8.2), sans jeton d'API : après une CI verte, GitHub construit le site
# et publie out/ sur la branche « site » ; Hostinger, relié au dépôt dans hPanel, la redéploie à chaque push.
# N'écrit que dans public_html/ : private/config.php (clés) n'est jamais touché.
name: Déploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # shortcut: phase-4-developpement déploie aussi tant qu'elle n'est pas fusionnée ; ne garder que main ensuite.
    branches: [main, phase-4-developpement]
  workflow_dispatch:

permissions:
  contents: write # pousser la branche « site »

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, CSP et budget JavaScript
        run: |
          test -n "$SITE_URL" || { echo "Variable SITE_URL absente"; exit 1; }
          npm run build
          echo "$VERSION" > out/version.txt
      - name: Publier out/ sur la branche « site »
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin site >/dev/null; then
            git fetch origin site
            git worktree add publication origin/site
            git -C publication switch -c site
          else
            git worktree add --detach publication
            git -C publication switch --orphan site
          fi
          find publication -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. publication/
          git -C publication add -A
          git -C publication commit -q -m "site : ${VERSION:0:7}" || { echo "Rien de nouveau à publier."; exit 0; }
          git -C publication push origin site
      # Hostinger tire la branche après le push : on attend que la nouvelle version soit en ligne, puis on contrôle.
      - name: Contrôles du site en ligne
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            [ "$(curl -s "$SITE_URL/version.txt")" = "$VERSION" ] && break
            sleep 10
          done
          test "$(curl -s "$SITE_URL/version.txt")" = "$VERSION" || { echo "La nouvelle version n'est pas en ligne"; exit 1; }
          code() { curl -s -o /dev/null -w "%{http_code}" "$SITE_URL$1"; }
          for p in / /projets/ /a-propos/ /contact/ /mentions-legales/; do test "$(code $p)" = 200 || { echo "$p ne répond pas 200"; exit 1; }; done
          test "$(code /cette-page-nexiste-pas/)" = 404
          for p in /_app/ContactHandler.php /private/config.php /.htaccess /.git/config; do c=$(code $p); [[ "$c" = 403 || "$c" = 404 ]] || { echo "$p répond $c"; exit 1; }; done
          curl -sI "$SITE_URL/" | grep -qi "^content-security-policy: frame-ancestors 'none'"
          echo "Version ${VERSION:0:7} en ligne et vérifiée."
