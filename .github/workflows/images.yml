# Préparation des images (architecture.md §5, roadmap lot 11) : au push d'un original dans images-source/
# sur une branche de travail, ou à la main. Originaux déclarés dans content/images.ts.
# Résultat : commit sur la branche de travail (relu avant sa fusion dans main) ; jamais de push direct sur main,
# où le résultat est proposé en pull request (prérequis : Settings › Actions › General › autoriser les pull requests).
name: Images

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [images-source/**, content/images.ts]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      SHARP: "sharp@0.35.5" # installé seulement sur GitHub (R7)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save "$SHARP"
      # Échoue si un contrôle ne passe pas : nom, format, déclaration, format 4:5 de la photo, 200 Ko par fichier.
      - name: AVIF et WebP sans métadonnées
        run: node --experimental-strip-types scripts/images.mjs
      - name: Tests des images
        run: npx vitest run tests/unit/images.test.ts
      - name: Enregistrer les images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- public/images content/images-generees.json)" ]; then
            echo "Aucune image modifiée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images content/images-generees.json
          git commit -m "images: AVIF et WebP générés par le workflow Images"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            branche="images/${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/$branche"
            gh pr create --base main --head "$branche" \
              --title "Images : AVIF et WebP générés" \
              --body "Images préparées par le workflow Images (architecture.md §5). À vérifier visuellement avant fusion."
          fi
